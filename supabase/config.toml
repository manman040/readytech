project_id = "readytech"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
# PostGIS and pgcrypto live in the extensions schema; PostgREST needs it on the
# search path to resolve the generated geography columns.
extra_search_path = ["public", "extensions"]
# A cap, so a missing filter cannot pull the whole service history over the wire.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local mail catcher. Sign-up confirmation and password reset links land here
# during development, so no real email is ever sent from a dev machine.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Deep link back into the mobile app after a confirmation or reset.
site_url = "readytech://auth-callback"
additional_redirect_urls = ["readytech://auth-callback", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# ReadyTech has no anonymous browsing: every action is attributable to an
# account, which is what makes the audit trail and the dispute process work.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Changing an email address requires confirming both the old and the new one.
double_confirm_changes = true
# The whole verification flow in the app depends on this staying on.
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "Confirm your ReadyTech account"

[auth.sessions]
# Signs out a session that has been idle for a week.
inactivity_timeout = "168h"

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false
